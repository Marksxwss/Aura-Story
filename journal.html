<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal | AURA Curadoria de Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesque:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body class="bg-aura-white">
    <main id="main-content">
        <section class="py-24 px-6">
            <div class="container">
                <div class="grid-12 mb-20 reveal">
                    <div class="col-6">
                        <h1 class="text-5xl font-serif mb-6">Journal</h1>
                        <p class="text-aura-text-muted font-light text-lg">Reflexões sobre a matéria, a forma e o impacto do design no cotidiano.</p>
                    </div>
                </div>

                <div id="journal-grid" class="grid-12 gap-12">
                    <!-- Injetado via JS -->
                </div>
            </div>
        </section>
    </main>

    <script src="js/data/config.js"></script>
    <script src="js/data/products.js"></script>
    <script src="js/data/content.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/store.js"></script>
    <script src="js/core/layout.js"></script>
    <script src="js/features/animations.js"></script>
    <script src="js/features/cart.js"></script>
    <script src="js/features/search.js"></script>
    <script src="js/features/catalog.js"></script>
    <script src="js/features/product.js"></script>
    <script src="js/features/checkout.js"></script>
    <script src="js/features/forms.js"></script>
    <script src="js/features/cookies.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('journal-grid');
            if (grid) {
                grid.innerHTML = window.AURA_DATA.content.journal.map(art => `
                    <article class="col-4 reveal group">
                        <div class="aspect-video overflow-hidden mb-6">
                            <img src="${art.imagem}" alt="${art.titulo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-1000">
                        </div>
                        <span class="text-[10px] uppercase tracking-widest font-bold text-aura-terracotta">${art.data}</span>
                        <h3 class="text-2xl font-serif my-4 group-hover:text-aura-terracotta transition-colors"><a href="html/artigo.html?slug=${art.slug}">${art.titulo}</a></h3>
                        <p class="text-sm text-aura-text-muted font-light mb-6">${art.resumo}</p>
                        <a href="html/artigo.html?slug=${art.slug}" class="text-xs uppercase tracking-widest font-bold hover:text-aura-terracotta transition-colors">Ler Artigo &rarr;</a>
                    </article>
                `).join('');
                window.AURA.animations.initScrollReveal();
            }
        });
    </script>
</body>
</html>
