<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | AURA Curadoria de Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesque:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body class="bg-aura-white">
    <main id="main-content" class="py-20 px-6">
        <div class="container max-w-5xl">
            <div class="grid-12 gap-20">
                <div class="col-8">
                    <h1 class="text-4xl font-serif mb-12">Finalizar Pedido</h1>

                    <div id="step-indicator" class="text-[10px] uppercase tracking-widest font-bold text-aura-terracotta mb-8">Etapa 1 de 3</div>

                    <div id="checkout-steps" class="min-h-[400px]">
                        <!-- Injetado via checkout.js -->
                    </div>

                    <div class="mt-12 flex justify-between items-center border-t border-aura-border pt-8">
                        <button id="prev-step" class="text-xs uppercase tracking-widest font-bold opacity-0 pointer-events-none">Voltar</button>
                        <button id="next-step" class="btn btn-primary">Continuar</button>
                    </div>
                </div>

                <div class="col-4">
                    <div class="p-8 bg-aura-stone sticky top-32">
                        <h3 class="text-lg font-serif mb-6">Resumo do Pedido</h3>
                        <div id="checkout-summary" class="space-y-4 mb-8">
                            <!-- Injetado via JS -->
                        </div>
                        <div class="border-t border-aura-border pt-6 space-y-2">
                            <div class="flex justify-between text-sm font-light">
                                <span>Subtotal</span>
                                <span id="summary-subtotal">R$ 0,00</span>
                            </div>
                            <div class="flex justify-between text-sm font-light">
                                <span>Frete</span>
                                <span id="summary-shipping">R$ 0,00</span>
                            </div>
                            <div class="flex justify-between text-xl font-serif mt-4 pt-4 border-t border-aura-border">
                                <span>Total</span>
                                <span id="summary-total">R$ 0,00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="../js/data/config.js"></script>
    <script src="../js/data/products.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/core/store.js"></script>
    <script src="../js/core/layout.js"></script>
    <script src="../js/features/checkout.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
