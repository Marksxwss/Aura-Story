<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado | AURA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesque:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">

<body class="bg-aura-white">
    <main class="min-h-screen flex items-center justify-center px-6 py-20">
        <div class="max-w-2xl text-center reveal">
            <div class="mb-10 flex justify-center">
                <div class="w-20 h-20 rounded-full bg-aura-forest text-aura-white flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            </div>
            <h1 class="text-5xl font-serif mb-6">Pedido Recebido</h1>
            <p class="text-aura-text-muted text-lg font-light mb-12">
                Obrigado por escolher a AURA. Seu pedido foi processado com sucesso e você receberá a confirmação por e-mail em instantes.
            </p>
            <div class="p-8 border border-aura-border bg-aura-stone mb-12">
                <span class="text-xs uppercase tracking-widest font-bold block mb-2">Número do Pedido</span>
                <span class="text-2xl font-serif">#AU-992841</span>
            </div>
            <a href="../index.html" class="btn btn-primary">Voltar para a Loja</a>
        </div>
    </main>
    <script src="../js/core/layout.js"></script>
    <script src="../js/main.js"></script>
